<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Statistiken</title>
    <link href="/static/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
<div class="container">
    <h1>Statistiken</h1>

    <div class="row">
        <div class="col-md-6">
            <h2>Mitgliederstatistiken</h2>
            <div id="totalMembers"></div>
            <div id="newMembersThisYear"></div>
        </div>
        <div class="col-md-6">
            <h2>Beitragsstatistiken</h2>
            <div id="totalRevenueThisYear"></div>
            <div id="averagePaymentPerMember"></div>
            <div id="percentagePaidMembers"></div>
            <div id="totalOutstandingAmount"></div>
            <div id="membersWithOutstandingPayments"></div>
        </div>
    </div>

    <div class="row mt-4">
        <div class="col-12">
            <h2>Jährliche Mitgliederbewegungen</h2>
            <div class="card">
                <div class="card-body">
                    <div id="yearlyMovementsTable">
                        <div class="text-center">
                            <div class="spinner-border" role="status">
                                <span class="visually-hidden">Laden...</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <a href="/main" class="btn btn-secondary mt-3">Zurück zur Hauptseite</a>
</div>

<script>
    async function loadStatistics() {
        // Mitgliederstatistiken abrufen
        const membersResponse = await fetch('/members/stats');
        const membersData = await membersResponse.json();

        document.getElementById('totalMembers').innerText = `Gesamte Mitglieder-Datensätze: ${membersData.totalMembers}`;
        //document.getElementById('newMembersThisYear').innerText = `Neue Mitglieder dieses Jahr: ${membersData.newMembersThisYear}`;

        // Beitragsstatistiken abrufen
        const paymentsResponse = await fetch('/payments/stats');
        const paymentsData = await paymentsResponse.json();

        document.getElementById('totalRevenueThisYear').innerText = `Gesamtumsatz dieses Jahr: ${paymentsData.totalRevenueThisYear} €`;
        document.getElementById('averagePaymentPerMember').innerText = `Durchschnittliche Zahlung pro Mitglied: ${paymentsData.averagePaymentPerMember} €`;
        document.getElementById('percentagePaidMembers').innerText = `Prozentsatz der zahlenden Mitglieder: ${paymentsData.percentagePaidMembers}%`;
        document.getElementById('totalOutstandingAmount').innerText = `Ausstehende Zahlungen gesamt: ${paymentsData.totalOutstandingAmount} €`;
        document.getElementById('membersWithOutstandingPayments').innerText = `Mitglieder mit ausstehenden Zahlungen: ${paymentsData.membersWithOutstandingPayments}`;

        // Jährliche Mitgliederbewegungen abrufen
        await loadYearlyMovements();
    }

    async function loadYearlyMovements() {
        try {
            const response = await fetch('/members/yearly-movements');
            const data = await response.json();
            
            const tableContainer = document.getElementById('yearlyMovementsTable');
            
            if (data.movements && data.movements.length > 0) {
                const table = `
                    <table class="table table-striped table-hover">
                        <thead class="table-dark">
                            <tr>
                                <th scope="col">Jahr</th>
                                <th scope="col">Zugänge</th>
                                <th scope="col">Abgänge</th>
                                <th scope="col">Erwartete Abgänge</th>
                                <th scope="col">Zahlungseingänge</th>
                                <th scope="col">Stand zum 31.12.</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${data.movements.map(movement => {
                                const currentYear = new Date().getFullYear();
                                const isFuture = movement.jahr > currentYear;
                                const rowClass = isFuture ? 'table-info' : '';
                                
                                return `
                                <tr class="${rowClass}">
                                    <td><strong>${movement.jahr}${isFuture ? ' *' : ''}</strong></td>
                                    <td class="text-success">+${movement.zugaenge}</td>
                                    <td class="text-danger">-${movement.abgaenge}</td>
                                    <td class="text-warning">${movement.erwarteteAbgaenge > 0 ? `~${movement.erwarteteAbgaenge}` : '-'}</td>
                                    <td class="text-info">${movement.zahlungseingaenge > 0 ? `${movement.zahlungseingaenge.toLocaleString('de-DE', {minimumFractionDigits: 2, maximumFractionDigits: 2})} €` : '-'}</td>
                                    <td class="text-primary"><strong>${movement.standJahresende}</strong></td>
                                </tr>
                                `;
                            }).join('')}
                        </tbody>
                    </table>
                    <small class="text-muted">
                        Datenstand: ${new Date(data.referenceDate).toLocaleDateString('de-DE')}<br>
                        * Zukunftsjahre (nur erwartete Abgänge verfügbar)
                    </small>
                `;
                tableContainer.innerHTML = table;
            } else {
                tableContainer.innerHTML = '<p class="text-muted">Keine Daten verfügbar</p>';
            }
        } catch (error) {
            console.error('Fehler beim Laden der jährlichen Bewegungen:', error);
            document.getElementById('yearlyMovementsTable').innerHTML = 
                '<p class="text-danger">Fehler beim Laden der Daten</p>';
        }
    }

    loadStatistics();
</script>
<script src="/static/bootstrap.bundle.min.js"></script>
</body>
</html>
